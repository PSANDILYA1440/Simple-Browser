name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SimpleBrowser --icon=icon.ico main.py
      
      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v3
        with:
          name: SimpleBrowser-Windows
          path: dist/SimpleBrowser.exe
