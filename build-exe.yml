name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install PyQt6 PyQt6-WebEngine requests bcrypt pyinstaller
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name SimpleB browser main.py
      
      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: SimpleB-Windows
          path: dist/SimpleB.exe
